<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gambia Remita - Final Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>body{background:#0a0e1a;color:#e2e8f0;font-family:Inter,sans-serif;margin:0}.card{max-width:900px;margin:20px auto;background:#111827;border:1px solid #1f2937;border-radius:16px;padding:24px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}button{background:linear-gradient(135deg,#10b981,#059669);border:none;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #1f2937;padding:10px;font-size:13px}th{background:#0f172a;color:#94a3b8}.badge{padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700}.suc{background:rgba(16,185,129,.15);color:#10b981}.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hidden{display:none}</style>
</head><body>
<div id="login" class="card" style="max-width:420px;margin-top:80px">
<h2>👑 Gambia Remita Admin</h2><p style="color:#94a3b8;font-size:13px">Final Version - Supabase afzwszicghxwjyqkhbua</p>
<input id="email" value="tpaygambia@gmail.com"><input id="pass" type="password" value="Banta123Jareh@">
<button onclick="login()">🔐 Login Securely</button><p id="msg" style="color:#f87171;font-size:13px"></p>
<hr style="margin:16px 0;border-color:#1f2937"><button onclick="noLogin()" style="background:#334155">👀 View Without Login (Emergency)</button>
</div>
<div id="dash" class="card hidden">
<div class="hdr"><h3>👑 Dashboard - BANTABA</h3><div><button onclick="loadAll()" style="width:auto;padding:6px 10px">🔄</button><button onclick="logout()" style="width:auto;padding:6px 10px;background:#ef4444;margin-left:6px">Logout</button></div></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="background:#0f172a;padding:12px;border-radius:12px"><small>Total Stock</small><h2 id="s1">-</h2></div><div style="background:#0f172a;padding:12px;border-radius:12px"><small>Available</small><h2 id="s2" style="color:#10b981">-</h2></div><div style="background:#0f172a;padding:12px;border-radius:12px"><small>Sales</small><h2 id="s3">-</h2></div><div style="background:#0f172a;padding:12px;border-radius:12px"><small>Volume</small><h2 id="s4">D0</h2></div></div>
<h4 style="margin-top:20px">📦 Exam Codes (5)</h4><table><thead><tr><th>ID</th><th>CODE</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table>
<h4 style="margin-top:20px">💰 Transactions - D10000 Sale Found!</h4><table><thead><tr><th>Date</th><th>Phone</th><th>Service</th><th>Amount</th><th>Status</th><th>Exam Code</th></tr></thead><tbody id="tb2"></tbody></table>
</div>
<script>
const URL="https://afzwszicghxwjyqkhbua.supabase.co";
const KEY="sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS";
const sb=supabase.createClient(URL,KEY);
async function login(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;const m=document.getElementById('msg');m.textContent='Checking...';try{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error) throw error;document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadAll();}catch(err){m.textContent='❌ '+err.message+' | Try Emergency View button below';}}
async function noLogin(){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadAll();}
async function loadAll(){try{const {data:c}=await sb.from('exam_codes').select('*').order('id');document.getElementById('s1').textContent=c.length;document.getElementById('s2').textContent=c.filter(x=>!x.is_used).length;document.getElementById('tb').innerHTML=c.map(r=>`<tr><td>${r.id}</td><td><b>${r.code}</b></td><td><span class="badge suc">${r.is_used?'USED':'AVAILABLE ✅'}</span></td></tr>`).join('');const {data:t}=await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(100);document.getElementById('s3').textContent=t.length;const vol=t.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);document.getElementById('s4').textContent='D'+vol.toLocaleString();document.getElementById('tb2').innerHTML=t.map(r=>`<tr><td>${r.created_at? new Date(r.created_at).toLocaleString():''}</td><td>${r.customer_phone||''}</td><td>${r.service||''}</td><td><b>D${r.amount||0}</b></td><td><span class="badge suc">${r.status||''}</span></td><td><small>${r.exam_code||''}</small></td></tr>`).join('');}catch(e){alert(e.message)}}
async function logout(){await sb.auth.signOut(); location.reload();}
sb.auth.getSession().then(({data})=>{if(data.session){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadAll();}});
</script>
</body></html>
