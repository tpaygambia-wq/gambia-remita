<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remita Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0e1a;color:#fff;font-family:sans-serif;padding:12px}
.card{max-width:900px;margin:auto;background:#111827;border-radius:16px;padding:16px;border:1px solid #222}
.box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.b{background:#0f172a;padding:12px;border-radius:10px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
th,td{border:1px solid #222;padding:8px} th{background:#0f172a}
button{background:#10b981;border:0;padding:10px 16px;border-radius:8px;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h3>Remita Admin - GRA Sales</h3>
<div class="box">
<div class="b"><small>Total Sales</small><h2 id="c1">...</h2></div>
<div class="b"><small>Total Amount</small><h2 id="c2">...</h2></div>
<div class="b"><small>Live</small><h2>OK</h2></div>
</div>
<button onclick="loadData()" style="margin-top:12px">Refresh</button>
<p id="err" style="color:#f88"></p>
<table><thead><tr><th>Date</th><th>Customer</th><th>Phone</th><th>Service</th><th>Amount</th><th>Wave ID</th></tr></thead><tbody id="tb"><tr><td colspan=6>Loading...</td></tr></tbody></table>
</div>
<script>
const supabaseClient = supabase.createClient("https://afzwszicghxwjyqkhbua.supabase.co","sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS");
async function loadData(){
 try{
  const {data,error} = await supabaseClient.from('transactions').select('*').order('created_at',{ascending:false}).limit(100);
  if(error) throw error;
  document.getElementById('c1').textContent = data.length;
  let tot = 0; data.forEach(r=>{tot += Number(r.amount||r.government_amount||0)});
  document.getElementById('c2').textContent = 'D'+tot.toLocaleString();
  document.getElementById('tb').innerHTML = data.length ? data.map(r=>`<tr><td>${r.created_at?new Date(r.created_at).toLocaleDateString():''}</td><td>${r.customer_name||''}</td><td>${r.customer_phone||''}</td><td>${r.service_type||r.service||''}</td><td>D${r.amount||r.government_amount||0}</td><td style="font-size:10px">${r.wave_transaction_id||''}</td></tr>`).join('') : '<tr><td colspan=6>No sales yet</td></tr>';
 }catch(e){document.getElementById('err').textContent=e.message}
}
loadData();
</script>
</body>
</html>
