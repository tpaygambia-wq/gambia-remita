<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Dashboard</title>
<style>body{margin:0;font-family:sans-serif;background:#f8fafc}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0}main{max-width:600px;margin:0 auto;padding:16px}input{width:100%;padding:14px;border-radius:12px;border:2px solid #16a34a;margin:8px 0}button{padding:10px 14px;border:none;border-radius:10px;font-weight:800} .card{background:#fff;border-radius:14px;padding:12px;border:1px solid #e2e8f0;margin:10px 0}</style></head><body>
<header><b>🔒 Boss Dashboard</b> <small>Password: admin123</small></header>
<main><input id="pass" type="password" placeholder="Enter Password admin123"><button onclick="login()" style="width:100%;background:#16a34a;color:#fff;padding:14px;border-radius:12px">Unlock</button><div id="dash" style="display:none"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0"><div class="card" style="margin:0"><small>TOTAL ORDERS</small><br><b id="c1" style="font-size:20px">0</b></div><div class="card" style="margin:0"><small>YOUR PROFIT 2%</small><br><b id="c2" style="font-size:18px;color:#16a34a">0 GMD</b></div><div class="card" style="margin:0"><small>GOV MONEY</small><br><b id="c3">0 GMD</b></div><div class="card" style="margin:0"><small>SETTLED</small><br><b id="c4">0 GMD</b></div></div><input id="search" placeholder="Search name, phone, RRR" oninput="render()"><div style="display:flex;gap:8px"><button onclick="exportCSV()" style="background:#0f172a;color:#fff;flex:1">Excel for Bank</button><button onclick="markSettled()" style="background:#f1f5f9;flex:1">Mark Settled</button></div><div id="list"></div></div></main>
<script>
let orders=[];function login(){if(document.getElementById('pass').value!=='admin123'){alert('Wrong! Use admin123');return}document.getElementById('dash').style.display='block';load();}
function load(){try{orders=JSON.parse(localStorage.getItem('remitaOrders')||'[]');}catch(e){orders=[]}render();}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let filt=orders.filter(o=>(o.name+o.phone+o.id+String(o.rrr)).toLowerCase().includes(q)).reverse();let profit=filt.reduce((s,o)=>s+(Number(o.fee)||0),0);let gov=filt.reduce((s,o)=>s+(Number(o.amount)||0),0);let sett=Number(localStorage.getItem('remSet')||0);document.getElementById('c1').innerText=filt.length;document.getElementById('c2').innerText=profit.toFixed(2)+' GMD';document.getElementById('c3').innerText=gov.toFixed(2)+' GMD';document.getElementById('c4').innerText=sett.toFixed(2)+' GMD';let h='';filt.forEach(o=>{h+=`<div class="card"><b>${o.name}</b> <small>${o.phone}</small><br><small>${o.inst} | ${o.date}</small><br>Gov: <b>GMD ${Number(o.amount).toFixed(2)}</b> Fee: <b style="color:#16a34a">GMD ${Number(o.fee).toFixed(2)}</b><br>ORD: ${o.id}<br>RRR: <b style="color:#16a34a">${o.rrr}</b> <span style="background:${o.status==='APPROVED'?'#dcfce7':'#fef9c3'};padding:2px 8px;border-radius:10px;font-size:10px">${o.status}</span><br><div style="margin-top:8px;display:flex;gap:6px"><button onclick="approve('${o.id}')" style="background:#16a34a;color:#fff">Approve</button><button onclick="navigator.clipboard.writeText('${o.rrr}')" style="background:#f1f5f9">Copy</button><button onclick="delOrder('${o.id}')" style="background:#fee2e2">Delete</button></div></div>`});document.getElementById('list').innerHTML=h||'<p>No orders</p>';}
function approve(id){orders=orders.map(x=>{if(x.id===id)x.status='APPROVED';return x});localStorage.setItem('remitaOrders',JSON.stringify(orders));render();}
function delOrder(id){if(!confirm('Delete?'))return;orders=orders.filter(x=>x.id!==id);localStorage.setItem('remitaOrders',JSON.stringify(orders));render();}
function markSettled(){if(!confirm('Mark settled? Profit stays.'))return;let gov=orders.reduce((s,o)=>s+(Number(o.amount)||0),0);let set=Number(localStorage.getItem('remSet')||0)+gov;localStorage.setItem('remSet',set);localStorage.setItem('remitaOrders',JSON.stringify([]));orders=[];render();}
function exportCSV(){let csv='Name,Phone,Inst,GovAmount,Fee,OrderID,RRR,Status,Date\n';orders.forEach(o=>{csv+=`"${o.name}",${o.phone},"${o.inst}",${o.amount},${o.fee},${o.id},${o.rrr},${o.status},${o.date}\n`});let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='bank_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
</script></body></html>
