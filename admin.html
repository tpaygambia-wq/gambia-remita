<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8.2 - Ousman Tunkara - New Key Cloud</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:#0a0e1e;color:#e2e8f0;min-height:100vh}
.login{height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#050a14}
.card-login{background:#101b36;padding:26px;border-radius:22px;width:100%;max-width:360px;border:1px solid rgba(255,255,255,.1)}
input{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0b1226;color:white;outline:none}
.btn{padding:10px 16px;border:none;border-radius:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-g{background:#22c55e;color:#000} .btn-gray{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.1)} .btn-red{background:rgba(239,68,68,.15);color:#f87171} .btn-black{background:#111827;color:white}
.top{background:#101b36;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:black}
.badge-verified{background:#3b82f6;color:white;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}
.chart-box{margin:12px;background:#111a32;border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.06)}
.main-tabs{display:flex;gap:10px;padding:12px 14px;overflow:auto}
.mtab{padding:10px 20px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);cursor:pointer;white-space:nowrap;font-size:14px;font-weight:800;color:#94a3b8}
.mtab.active{background:#22c55e;color:black}
.search-row{display:flex;gap:10px;padding:10px 14px}
.search-row input{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:14px}
.sub-tabs{display:flex;gap:8px;padding:8px 14px;overflow:auto}
.stab{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:#94a3b8}
.stab.active{background:white;color:black}
.order-card{background:#f8fafc;color:#111827;border-radius:18px;margin:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);border-left:6px solid #22c55e;overflow:hidden}
.order-card.PENDING{border-left-color:#f59e0b}
.order-top{padding:12px 14px 0;display:flex;justify-content:space-between}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}.badge-p{background:#fef3c7;color:#92400e}.badge-a{background:#dcfce7;color:#166534}
.order-body{padding:8px 14px;font-size:13px;line-height:1.5;color:#4b5563}
.order-actions{display:flex;gap:8px;padding:10px 14px 14px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-box{background:#101b36;width:100%;max-width:460px;border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.1);color:white}
</style>
</head>
<body>
<div id="loginDiv" class="login"><div class="card-login"><div style="text-align:center;margin-bottom:16px"><div style="width:56px;height:56px;background:linear-gradient(135deg,#22c55e,#3b82f6);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin:auto">👑</div><h3 style="margin-top:10px">Ousman Tunkara</h3><p style="color:#94a3b8;font-size:11px">V8.2 NEW KEY • afzwszicghxwjyqkhbua</p><p id="cloudStat" style="color:#22c55e;font-size:10px;margin-top:4px;font-weight:800">● Ready New Key</p></div><input id="pass" type="password" placeholder="OT2026CEO"><button class="btn btn-g" style="width:100%;justify-content:center;margin-top:8px;padding:13px" onclick="login()">Enter Empire</button><p id="err" style="color:#f87171;text-align:center;margin-top:8px;font-size:12px"></p></div></div>
<div id="adminDiv" style="display:none">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">OT</div><div><div style="display:flex;gap:8px;align-items:center"><b style="font-size:16px">Ousman Tunkara</b><span class="badge-verified"><i class="fa fa-check-circle"></i> VERIFIED CEO</span></div><div style="font-size:12px;color:#22c55e;font-weight:700"><i class="fa fa-crown"></i> Founder • Gambia Remita • Wave 872713918</div><div style="font-size:11px;color:#64748b" id="clock"></div><div style="font-size:10px;color:#22c55e" id="debugTxt">New Publishable Key Active</div></div></div><div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="openSet()"><i class="fa fa-cog"></i></button><button class="btn btn-gray" onclick="location.reload()"><i class="fa fa-sign-out"></i></button></div></div>
<div class="chart-box"><div style="display:flex;justify-content:space-between"><small style="color:#94a3b8;font-weight:800">Daily Usage - Last 7 Days</small><small id="chartTot" style="color:#22c55e;font-weight:900"></small></div><canvas id="chart" height="100"></canvas></div>
<div class="main-tabs"><div class="mtab active" onclick="switchMain('orders',this)"><i class="fa fa-receipt"></i> Orders</div><div class="mtab" onclick="switchMain('daily',this)"><i class="fa fa-calendar"></i> Daily</div><div class="mtab" onclick="switchMain('bank',this)"><i class="fa fa-image"></i> Bank Slip</div></div>
<div id="pane-orders"><div class="search-row"><input id="search" placeholder="🔍 Search RRR, ORD, Name, Phone..." oninput="render()"><button class="btn btn-gray" onclick="loadCloud()"><i class="fa fa-sync"></i></button></div><div class="sub-tabs"><div class="stab active" onclick="filterSt('all',this)">All</div><div class="stab" onclick="filterSt('PENDING',this)">Pending <span id="pCount" style="background:#ef4444;color:white;padding:1px 6px;border-radius:10px;font-size:11px">0</span></div><div class="stab" onclick="filterSt('APPROVED',this)">Approved</div><div class="stab">API</div></div><div id="list" style="padding-bottom:80px"></div></div>
<div id="pane-daily" style="display:none;padding:14px"><div style="background:#111a32;padding:14px;border-radius:14px"><b>Daily Cloud</b></div></div>
<div id="pane-bank" style="display:none;padding:14px"><div style="background:#111a32;padding:14px;border-radius:14px"><b>Bank Slips</b></div></div>
</div>
<div id="detailM" class="modal" onclick="if(event.target===this)closeD()"><div class="modal-box" id="detailC"></div></div>
<div id="setM" class="modal" onclick="if(event.target===this)closeS()"><div class="modal-box"><h3>Settings</h3><input id="feeInp" type="number"><button class="btn btn-g" style="width:100%;margin-top:10px" onclick="saveFee()">Save</button><button class="btn btn-black" style="width:100%;margin-top:8px" onclick="bulk()">Approve All</button></div></div>
<script>
const supabaseUrl = "https://afzwszicghxwjyqkhbua.supabase.co";
const supabaseKey = "sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS";
const sb = supabase.createClient(supabaseUrl, supabaseKey);
let txs=[]; let curF="all"; let chartI=null;
const $=id=>document.getElementById(id);
function getFee(){return parseFloat(localStorage.getItem("ot_fee")||"2");}
function getPass(){return localStorage.getItem("ot_admin_pass")||"OT2026CEO";}
function genRRR(){return "GRR-"+Math.floor(100000000000+Math.random()*900000000000);}
async function login(){
 if($("pass").value!==getPass()){$("err").innerText="Wrong";return;}
 $("loginDiv").style.display="none";$("adminDiv").style.display="block";
 setInterval(()=>{$("clock").innerText=new Date().toLocaleTimeString()+" • New Key Live";},1000);
 await loadCloud();
}
async function loadCloud(){
 $("cloudStat").innerText="● Syncing Cloud...";$("debugTxt").innerText="Connecting with new publishable key...";
 let {data,error}=await sb.from("transactions").select("*").order("created_at",{ascending:false});
 if(error){$("cloudStat").innerText="● Error: "+error.message;$("debugTxt").innerText=error.message;return;}
 txs=data||[];
 $("cloudStat").innerText="● Cloud Connected • "+txs.length+" orders";
 $("debugTxt").innerText="Loaded: "+txs.length+" rows • New Key OK • ORD-7603529 should appear";
 render();renderChart();
}
function switchMain(id,el){["orders","daily","bank"].forEach(t=>{$("pane-"+t).style.display=t===id?"block":"none";});document.querySelectorAll(".mtab").forEach(x=>x.classList.remove("active"));el.classList.add("active");}
function filterSt(s,el){curF=s;document.querySelectorAll(".stab").forEach(x=>x.classList.remove("active"));el.classList.add("active");render();}
function isPending(t){return (t.status||"").toString().toUpperCase()==="PENDING";}
function render(){
 let q=($("search").value||"").toLowerCase().trim();
 let filt=txs.filter(t=>{
  let st=(t.status||"").toString().toUpperCase();
  if(curF==="PENDING"&&st!=="PENDING")return false;
  if(curF==="APPROVED"&&st==="PENDING")return false;
  if(q){let hay=((t.rrr||"")+(t.ord||"")+(t.customer||"")+(t.phone||"")).toLowerCase(); if(!hay.includes(q))return false;}
  return true;
 });
 let pend=txs.filter(t=>isPending(t)).length; $("pCount").innerText=pend;
 let list=$("list"); list.innerHTML="";
 if(filt.length===0){
  let msg=txs.length===0?"Cloud EMPTY! Submit order again!":"No match filter "+curF+" search '"+q+"' • Total "+txs.length;
  list.innerHTML="<div style='text-align:center;padding:60px 20px;color:#64748b'><div style='font-size:54px'>🗃️</div><div style='margin-top:12px;font-weight:800'>No orders</div><div style='font-size:13px'>"+msg+"</div><button class='btn btn-gray' style='margin-top:14px' onclick='loadCloud()'>Sync Cloud Now</button><div style='margin-top:10px;font-size:10px;color:#22c55e'>"+txs.length+" total • New Key Active</div></div>";return;
 }
 filt.forEach(t=>{
  let st=(t.status||"PENDING").toString().toUpperCase();
  let badge=st==="PENDING"?`<span class="badge badge-p">PENDING</span>`:`<span class="badge badge-a">APPROVED • ${t.rrr}</span>`;
  let div=document.createElement("div");div.className="order-card "+st;
  div.innerHTML=`<div class="order-top"><div style="font-weight:900">${t.ord}</div>${badge}</div><div class="order-body">Name: <b>${t.customer}</b> • ${t.phone}<br>${t.merchant} - ${t.service}<br>D${Number(t.amount).toFixed(0)} + D${Number(t.fee).toFixed(0)} = D${Number(t.total).toFixed(0)}<br>ORD: ${t.ord} • RRR: ${t.rrr||"Awaiting"}<br>Wave: ${t.payref||t.payRef||""} • ${t.date}</div><div class="order-actions">${st==="PENDING"?`<button class="btn btn-black" style="flex:1" onclick="approve('${t.id}')">Approve & RRR</button><button class="btn btn-gray" onclick="view('${t.id}')">View</button>`:`<button class="btn btn-gray" style="flex:1" onclick="view('${t.id}')">Approved</button>`}<button class="btn btn-red" onclick="delTx('${t.id}')">Del</button></div>`;
  list.appendChild(div);
 });
}
async function approve(id){let t=txs.find(x=>x.id===id);let newRRR=genRRR();if(!confirm("Approve "+t.customer+"?"))return;let {error}=await sb.from("transactions").update({status:"APPROVED",rrr:newRRR}).eq("id",id);if(error){alert(error.message);return;}alert("APPROVED "+newRRR);await loadCloud();}
async function delTx(id){if(!confirm("Delete?"))return;await sb.from("transactions").delete().eq("id",id);await loadCloud();}
function view(id){let t=txs.find(x=>x.id===id);$("detailC").innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Order</h3><button class="btn btn-gray" onclick="closeD()">X</button></div><div style="margin-top:10px;background:rgba(255,255,255,.06);padding:12px;border-radius:12px"><b>${t.customer}</b><br>${t.phone}<br>ORD: <b style="color:#f59e0b">${t.ord}</b><br>RRR: <b style="color:#22c55e">${t.rrr}</b><br>Wave: ${t.payref||t.payRef}<br>${t.date}</div><div style="margin-top:10px;background:rgba(34,197,94,.1);padding:12px;border-radius:12px">${t.merchant} - ${t.service}<br>D${t.amount}+D${t.fee}=D${t.total}</div>${(t.status||"").toUpperCase()==="PENDING"?`<button class="btn btn-g" style="width:100%;margin-top:12px" onclick="approve('${t.id}');closeD()">Approve Now</button>`:`<div style="margin-top:12px;background:#dcfce7;color:#166534;padding:10px;border-radius:10px;text-align:center;font-weight:900">${t.rrr}</div>`}`;$("detailM").classList.add("show");}
function closeD(){$("detailM").classList.remove("show");}function openSet(){$("setM").classList.add("show");$("feeInp").value=getFee();}function closeS(){$("setM").classList.remove("show");}function saveFee(){localStorage.setItem("ot_fee",$("feeInp").value);alert("Saved");closeS();render();}
async function bulk(){if(!confirm("Approve all?"))return;for(let t of txs.filter(x=>isPending(x))){await sb.from("transactions").update({status:"APPROVED",rrr:genRRR()}).eq("id",t.id);}await loadCloud();}
function renderChart(){let map={};for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toLocaleDateString();map[k]={v:0,l:d.toLocaleDateString('en',{weekday:'short'})};}txs.forEach(t=>{let k=new Date(t.date).toLocaleDateString();if(map[k])map[k].v+=Number(t.amount);});let labs=Object.values(map).map(m=>m.l);let vals=Object.values(map).map(m=>m.v);let tot=vals.reduce((a,b)=>a+b,0);$("chartTot").innerText="7d: D"+tot.toLocaleString();let ctx=$("chart").getContext("2d");if(chartI)chartI.destroy();chartI=new Chart(ctx,{type:'bar',data:{labels:labs,[STRIPPED]
</script>
</body>
</html>
