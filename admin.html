<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OT V9.2 NO LOGIN PRO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:system-ui;background:#070c1c;color:#e2e8f0}.top{position:sticky;top:0;background:#101b36;padding:14px;display:flex;justify-content:space-between;align-items:center}.stat{background:#111a32;padding:10px;border-radius:12px}.order-card{background:#f8fafc;color:#111;border-radius:16px;margin:10px;padding:12px;border-left:6px solid #22c55e}</style>
</head><body>
<div class="top"><div><b>Ousman Tunkara - V9.2 NO LOGIN</b><div id="stat" style="font-size:11px;color:#22c55e">Connecting...</div><div id="clock" style="font-size:10px"></div></div><button onclick="location.reload()" style="padding:8px 12px;border-radius:8px;border:none;font-weight:800">Reload</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px"><div class="stat"><small>Orders</small><b id="sTotal">0</b></div><div class="stat"><small>Pending</small><b id="sPend">0</b></div><div class="stat"><small>Volume</small><b id="sVol">D0</b></div><div class="stat"><small>Profit</small><b id="sProfit" style="color:#22c55e">D0</b></div></div>
<div style="margin:10px;background:#111a32;padding:10px;border-radius:12px"><canvas id="chart" height="80"></canvas></div>
<div style="padding:10px"><input id="search" oninput="render()" placeholder="Search ORD Name Phone" style="width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0b1226;color:white"></div>
<div id="list"></div>
<script>
const supabaseUrl="https://afzwszicghxwjyqkhbua.supabase.co";
const supabaseKey="sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS";
const sb=supabase.createClient(supabaseUrl,supabaseKey);
let txs=[],chartI=null;
const $=id=>document.getElementById(id);
function genRRR(){return "GRR-"+Math.floor(100000000000+Math.random()*900000000000);}
async function loadCloud(){
 $("stat").innerText="● Syncing...";
 let {data,error}=await sb.from("transactions").select("*").order("created_at",{ascending:false});
 if(error){$("stat").innerText="● Error: "+error.message;return;}
 txs=data||[]; $("stat").innerText="● Connected • "+txs.length+" orders • No Login Mode • afzwszicghxwjyqkhbua";
 let tot=txs.length,pend=txs.filter(t=>(t.status||"").toUpperCase()=="PENDING").length,vol=txs.reduce((a,b)=>a+Number(b.total||0),0),prof=txs.reduce((a,b)=>a+Number(b.fee||0),0);
 $("sTotal").innerText=tot;$("sPend").innerText=pend;$("sVol").innerText="D"+vol.toLocaleString();$("sProfit").innerText="D"+prof.toLocaleString();
 render();renderChart();
}
function render(){
 let q=($("search").value||"").toLowerCase();
 let list=$("list");list.innerHTML="";
 let filt=txs.filter(t=>{if(!q)return true;return ((t.ord||"")+(t.customer||"")+(t.phone||"")).toLowerCase().includes(q);});
 filt.forEach(t=>{
  let div=document.createElement("div");div.className="order-card";
  div.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${t.ord}</b><b style="color:${t.status=="APPROVED"?"#16a34a":"#d97706"}">${t.status} • ${t.rrr}</b></div>
  <div style="margin-top:6px;font-size:13px">Name: <b>${t.customer}</b> • ${t.phone}<br>${t.merchant} - ${t.service}<br>D${t.amount}+D${t.fee}=D${t.total}<br>Wave: ${t.payref||t.payRef}<br>${t.date}</div>
  <div style="display:flex;gap:6px;margin-top:8px">
  ${t.status!="APPROVED"?`<button onclick="approve('${t.id}')" style="flex:1;padding:12px;background:#111827;color:white;border:none;border-radius:8px;font-weight:800">Approve & RRR</button>`:`<div style="flex:1;background:#dcfce7;color:#166534;padding:10px;border-radius:8px;text-align:center;font-weight:900">${t.rrr}</div>`}
  <button onclick="delTx('${t.id}')" style="padding:10px;background:#fee2e2;color:#ef4444;border:none;border-radius:8px">Del</button>
  </div>`;
  list.appendChild(div);
 });
}
async function approve(id){let t=txs.find(x=>x.id==id);let r=genRRR();if(!confirm("Approve "+t.ord+"? "+r))return;await sb.from("transactions").update({status:"APPROVED",rrr:r}).eq("id",id);loadCloud();}
async function delTx(id){if(!confirm("Delete?"))return;await sb.from("transactions").delete().eq("id",id);loadCloud();}
function renderChart(){let map={};for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toLocaleDateString();map[k]={v:0,l:d.toLocaleDateString('en',{weekday:'short'})};}txs.forEach(t=>{let k=new Date(t.date).toLocaleDateString();if(map[k])map[k].v+=Number(t.amount);});let labs=Object.values(map).map(m=>m.l),vals=Object.values(map).map(m=>m.v);let ctx=$("chart").getContext("2d");if(chartI)chartI.destroy();chartI=new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{data:vals,backgroundColor:'#22c55e'}]},options:{plugins:{legend:{display:false}}}});}
setInterval(()=>{$("clock").innerText=new Date().toLocaleString()+" • Live • NO PASSWORD NEEDED";},1000);
loadCloud();
</script></body></html>
