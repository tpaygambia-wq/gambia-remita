<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8.4 Emergency No Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:#0a0e1e;color:#e2e8f0;min-height:100vh}
.top{background:#101b36;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:black}
.order-card{background:#f8fafc;color:#111827;border-radius:18px;margin:10px 14px;border-left:6px solid #f59e0b;padding:14px}
.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-black{background:#111827;color:white}.btn-red{background:rgba(239,68,68,.15);color:#f87171}.btn-g{background:#22c55e;color:black}
</style>
</head>
<body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">OT</div><div><b>Ousman Tunkara - EMERGENCY ADMIN</b><div style="font-size:11px;color:#22c55e" id="clock">Live</div><div style="font-size:11px" id="stat">Connecting...</div></div></div><button class="btn btn-g" onclick="loadCloud()">Sync Cloud</button></div>
<div style="margin:12px;background:#111a32;border-radius:18px;padding:14px"><small style="color:#94a3b8">Daily Usage - Last 7 Days</small> <small id="chartTot" style="color:#22c55e;float:right"></small><canvas id="chart" height="90"></canvas></div>
<div style="padding:10px 14px;display:flex;gap:10px"><input id="search" placeholder="Search ORD, Name, Phone..." oninput="render()" style="flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:white"><span id="pCount" style="background:#ef4444;color:white;padding:8px 12px;border-radius:20px;font-weight:900">Pending 0</span></div>
<div id="list" style="padding-bottom:80px"></div>

<script>
const supabaseUrl = "https://afzwszicghxwjyqkhbua.supabase.co";
const supabaseKey = "sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS";
const sb = supabase.createClient(supabaseUrl, supabaseKey);
let txs=[];let chartI=null;
const $=id=>document.getElementById(id);
function genRRR(){return "GRR-"+Math.floor(100000000000+Math.random()*900000000000);}
async function loadCloud(){
 $("stat").innerText="● Syncing Cloud with new key...";$("stat").style.color="#f59e0b";
 let {data,error}=await sb.from("transactions").select("*").order("created_at",{ascending:false});
 if(error){$("stat").innerText="● Error: "+error.message;$("stat").style.color="#ef4444";return;}
 txs=data||[];
 $("stat").innerText="● Cloud Connected • "+txs.length+" orders • ORD-6774091 should appear";
 $("stat").style.color="#22c55e";
 render();renderChart();
}
function render(){
 let q=($("search").value||"").toLowerCase();
 let filt=txs.filter(t=>{if(!q)return true;let hay=((t.ord||"")+(t.customer||"")+(t.phone||"")+(t.rrr||"")).toLowerCase();return hay.includes(q);});
 $("pCount").innerText="Pending "+txs.filter(t=>(t.status||"").toUpperCase()==="PENDING").length;
 let list=$("list");list.innerHTML="";
 if(filt.length===0){list.innerHTML="<div style='text-align:center;padding:60px;color:#94a3b8'><div style='font-size:50px'>🗃️</div><b>No orders</b><br>Cloud has "+txs.length+" rows<br><button class='btn btn-g' style='margin-top:10px' onclick='loadCloud()'>Sync Now</button><br><small style='font-size:10px;margin-top:10px;display:block'>If 0 rows, submit customer again</small></div>";return;}
 filt.forEach(t=>{
  let st=(t.status||"").toUpperCase();
  let div=document.createElement("div");div.className="order-card";
  div.innerHTML=`<div style="display:flex;justify-content:space-between"><b style="font-size:18px">${t.ord}</b><span style="background:${st==="PENDING"?"#fef3c7":"#dcfce7"};color:${st==="PENDING"?"#92400e":"#166534"};padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900">${st} • ${t.rrr}</span></div><div style="margin-top:10px;line-height:1.6;font-size:14px">Name: <b>${t.customer}</b> • ${t.phone}<br>${t.merchant} - ${t.service}<br>Gov D${Number(t.amount).toFixed(0)} + Fee D${Number(t.fee).toFixed(0)} = <b>D${Number(t.total).toFixed(0)}</b><br>ORD: <b style="color:#f59e0b">${t.ord}</b> • RRR: <b style="color:#16a34a">${t.rrr}</b><br>Wave: ${t.payref||t.payRef||""} • ${t.date}</div><div style="display:flex;gap:8px;margin-top:12px">${st==="PENDING"?`<button class="btn btn-black" style="flex:1;padding:14px" onclick="approve('${t.id}')">✅ Approve & Generate RRR</button>`:`<div style="flex:1;background:#dcfce7;color:#166534;padding:14px;border-radius:10px;text-align:center;font-weight:900">APPROVED ${t.rrr}</div>`}<button class="btn btn-red" onclick="delTx('${t.id}')">🗑️</button></div>`;
  list.appendChild(div);
 });
}
async function approve(id){let t=txs.find(x=>x.id===id);let newRRR=genRRR();if(!confirm("Approve "+t.customer+" "+t.ord+" ?\nGenerate "+newRRR+" ?"))return;let {error}=await sb.from("transactions").update({status:"APPROVED",rrr:newRRR}).eq("id",id);if(error){alert(error.message);return;}alert("✅ APPROVED!\n"+t.ord+"\nRRR: "+newRRR+"\nCustomer can track now!");await loadCloud();}
async function delTx(id){if(!confirm("Delete this order?"))return;await sb.from("transactions").delete().eq("id",id);await loadCloud();}
function renderChart(){let map={};for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toLocaleDateString();map[k]={v:0,l:d.toLocaleDateString('en',{weekday:'short'})};}txs.forEach(t=>{let k=new Date(t.date).toLocaleDateString();if(map[k])map[k].v+=Number(t.amount);});let labs=Object.values(map).map(m=>m.l);let vals=Object.values(map).map(m=>m.v);let tot=vals.reduce((a,b)=>a+b,0);$("chartTot").innerText="7d D"+tot.toLocaleString();let ctx=$("chart").getContext("2d");if(chartI)chartI.destroy();chartI=new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{data:vals,backgroundColor:"#22c55e",borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{display:false},x:{grid:{display:false},ticks:{color:"#94a3b8"}}}}});}
setInterval(()=>{$("clock").innerText=new Date().toLocaleTimeString()+" • Live • No Password Needed";},1000);
loadCloud();
</script>
</body>
</html>
