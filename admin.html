<!DOCTYPE html>
<html>
<head>
<title>Admin Boss - Ousman Only</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.login{max-width:350px;margin:80px auto;background:white;color:black;padding:25px;border-radius:15px;text-align:center}
.card{background:white;color:black;padding:12px;border-radius:10px;margin:8px 0}
.pending{border-left:6px solid orange} .paid{border-left:6px solid green}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:white;color:black;padding:15px;border-radius:10px;text-align:center}
button{padding:8px 12px;border-radius:6px;border:none;margin:2px;cursor:pointer;font-weight:bold}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div id="loginBox" class="login">
<h2>🔐 Boss Only</h2><p>Enter PIN to access admin</p>
<input id="pin" type="password" placeholder="Enter PIN" style="width:100%;padding:12px;margin:10px 0">
<button onclick="login()" style="background:#006633;color:white;width:100%;padding:12px">LOGIN</button>
<p style="font-size:11px;color:gray">Default PIN: 6599</p>
</div>
<div id="adminBox" style="display:none">
<div class="topbar">
<h2>🇬🇲 Boss Dashboard</h2>
<button onclick="logout()" style="background:red;color:white">Logout</button>
</div>
<div class="stats">
<div class="stat"><h3 id="totalCust">0</h3><small>Total Customers</small></div>
<div class="stat"><h3 id="totalFees">0 GMD</h3><small>YOUR PROFIT 2%</small></div>
<div class="stat"><h3 id="pendingAmt">0 GMD</h3><small>Gov Money To Pay At Bank</small></div>
<div class="stat"><h3 id="paidCount">0</h3><small>Paid Already</small></div>
</div>
<input id="search" placeholder="🔍 Search name, phone, RRR..." oninput="render()" style="width:100%;padding:12px;border-radius:8px;margin:10px 0;box-sizing:border-box">
<select id="filterInst" onchange="render()" style="width:100%;padding:10px;border-radius:8px"><option value="">All Institutions</option><option>UTG</option><option>GRA</option><option>MOBSE</option><option>GPF</option><option>GTTI</option><option>GAMBIA COLLEGE</option></select>
<div style="margin:10px 0">
<button onclick="exportExcel()" style="background:green;color:white">📥 Excel for Bank</button>
<button onclick="clearPaid()" style="background:orange;color:black">Clear Paid Only</button>
<button onclick="clearAll()" style="background:red;color:white">Delete ALL</button>
</div>
<div id="list"></div>
</div>
<script>
const MY_PIN="6599";
function login(){ if(document.getElementById('pin').value==MY_PIN){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').style.display='block'; localStorage.setItem('admin_ok','yes'); render(); } else alert('Wrong PIN!'); }
function logout(){ localStorage.removeItem('admin_ok'); location.reload(); }
if(localStorage.getItem('admin_ok')=='yes'){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').style.display='block'; }
function getData(){ return JSON.parse(localStorage.getItem('gambia_payments')||'[]'); }
function saveData(d){ localStorage.setItem('gambia_payments', JSON.stringify(d)); }
function render(){
 let data=getData(); let q=document.getElementById('search').value.toLowerCase(); let fInst=document.getElementById('filterInst').value;
 let filtered=data.filter(x=> (x.name+x.phone+x.rrr+x.institution).toLowerCase().includes(q) && (fInst==''||x.institution==fInst));
 let pending=data.filter(x=>x.status=='pending'); let paid=data.filter(x=>x.status=='paid');
 document.getElementById('totalCust').innerText=data.length;
 document.getElementById('totalFees').innerText=data.reduce((s,x)=>s+x.fee,0).toFixed(2)+' GMD';
 document.getElementById('pendingAmt').innerText=pending.reduce((s,x)=>s+x.amt,0).toFixed(2)+' GMD';
 document.getElementById('paidCount').innerText=paid.length;
 document.getElementById('list').innerHTML=filtered.reverse().map(x=>`
  <div class="card ${x.status}">
   <b>${x.name.toUpperCase()}</b> | ${x.rrr} <span style="float:right">${x.status.toUpperCase()}</span><br>
   🏫 ${x.institution} | 💰 Gov: ${x.amt} GMD | 💸 Fee: ${x.fee} GMD<br>
   📱 ${x.phone} | 💳 ${x.method} | 📅 ${x.date}<br>
   <button onclick="markPaid('${x.rrr}')" style="background:green;color:white">✅ PAID at Bank</button>
   <button onclick="wa('${x.phone}','${x.name}','${x.rrr}')" style="background:#25D366;color:white">WhatsApp</button>
   <button onclick="delOne('${x.rrr}')" style="background:red;color:white">Delete</button>
  </div>
 `).join('') || '<p>No payments yet</p>';
}
function markPaid(rrr){ let d=getData(); let i=d.find(x=>x.rrr==rrr); if(i)i.status='paid'; saveData(d); render(); }
function delOne(rrr){ if(!confirm('Delete '+rrr+'?'))return; let d=getData().filter(x=>x.rrr!=rrr); saveData(d); render(); }
function wa(phone,name,rrr){ let num=phone.replace(/[^0-9]/g,'').slice(-8); window.open(`https://wa.me/220${num}?text=Hello ${name}, Your payment ${rrr} is CONFIRMED and PAID. Thank you - Remita Gambia`); }
function exportExcel(){ let d=getData(); if(!d.length)return alert('No data'); let csv="RRR,Name,Phone,Institution,Gov Amount,Fee,Method,Date,Status\n"+d.map(x=>`${x.rrr},"${x.name}",${x.phone},${x.institution},${x.amt},${x.fee},${x.method},"${x.date}",${x.status}`).join("\n"); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bank_payments.csv'; a.click(); }
function clearPaid(){ if(!confirm('Delete only PAID?'))return; let d=getData().filter(x=>x.status!='paid'); saveData(d); render(); }
function clearAll(){ if(!confirm('DELETE EVERYTHING?'))return; localStorage.removeItem('gambia_payments'); render(); }
render();
</script>
</body>
</html>
