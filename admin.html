<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - GAMBIA Remita GRR V6</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f8fafc}header{background:#000;color:#fff;padding:18px 16px;display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;background:linear-gradient(135deg,#4ade80,#facc15);border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;box-shadow:0 0 18px rgba(74,222,128,0.5);border:2px solid #22c55e}.card{background:#fff;border-radius:20px;padding:18px;margin:12px;border:1px solid #e2e8f0;max-width:600px;margin-left:auto;margin-right:auto}input{width:100%;padding:15px;border-radius:14px;border:2px solid #0f172a;margin:6px 0}.orderCard{border:2px solid #e2e8f0;border-radius:16px;padding:14px;margin:10px 0;background:#fff}.status-PENDING_PAYMENT{border-left:6px solid #f59e0b}.status-APPROVED{border-left:6px solid #16a34a}.btn{padding:10px 16px;border-radius:10px;font-weight:800;border:none;cursor:pointer;margin:4px}
</style></head><body>
<header><div class="logo">GR</div><div><b>GAMBIA Remita GRR<br>Admin Panel V6</b><br><small style="color:#86efac;font-weight:800">Wave 872713918 Mariam Tunkara • Fee 2% LOCKED</small></div></header>

<div id="login" class="card" style="margin-top:20px">
<b style="font-size:18px">Admin Login</b><br><small>Password to approve orders & release RRR</small>
<input id="pwd" type="password" placeholder="Password (admin123)" style="margin-top:12px">
<button onclick="login()" style="width:100%;background:#000;color:#fff;padding:15px;border:none;border-radius:14px;font-weight:900;margin-top:8px">Login</button>
<div style="margin-top:10px;font-size:11px;color:#64748b">Wave Account: 872713918 Mariam Tunkara - All payments to this Wave - Fee 2% cannot be avoided</div>
</div>

<div id="panel" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>Orders</b><button onclick="location.reload()" style="padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1">Refresh</button></div>
<small style="color:#64748b">Approve payment → Customer gets RRR + QR + Copy/Share/Save</small>
<div id="stats" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0"></div>
<div id="list"></div>
</div>
</div>

<script>
let orders=JSON.parse(localStorage.getItem('remitaOrders')||'[]');
function login(){
 if(document.getElementById('pwd').value!=='admin123'){alert('Wrong password! Use admin123');return}
 document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; render();
}
function render(){
 let list=document.getElementById('list'); let s={PENDING_PAYMENT:0,APPROVED:0,TOTAL:0};
 orders.forEach(o=>{s.TOTAL+=Number(o.total||0); if(o.status==='PENDING_PAYMENT')s.PENDING_PAYMENT++; if(o.status==='APPROVED')s.APPROVED++;});
 document.getElementById('stats').innerHTML=`<div style="background:#fffbeb;padding:10px;border-radius:12px;text-align:center;border:1px solid #fde68a"><b>${s.PENDING_PAYMENT}</b><br><small>Pending</small></div><div style="background:#f0fdf4;padding:10px;border-radius:12px;text-align:center;border:1px solid #bbf7d0"><b>${s.APPROVED}</b><br><small>Approved</small></div><div style="background:#eff6ff;padding:10px;border-radius:12px;text-align:center;border:1px solid #bfdbfe"><b>${s.TOTAL.toFixed(2)}</b><br><small>Total GMD</small></div>`;
 if(orders.length===0){list.innerHTML=`<div style="text-align:center;padding:20px;color:#64748b">No orders yet<br><small>Wave 872713918 Mariam Tunkara</small></div>`;return}
 list.innerHTML=orders.slice().reverse().map((o,i)=>{
  let realIndex=orders.length-1-orders.slice().reverse().indexOf(o); let idx=orders.findIndex(x=>x.id===o.id);
  return `<div class="orderCard status-${o.status}"><div style="display:flex;justify-content:space-between"><b>${o.id}</b><span style="font-size:11px;padding:4px 10px;border-radius:20px;font-weight:800;background:${o.status==='APPROVED'?'#dcfce7;color:#166534':'#fef3c7;color:#92400e'}">${o.status}</span></div><div style="font-size:13px;margin-top:8px">Name: <b>${o.name}</b> • ${o.phone}<br>Inst: ${o.inst}<br>Gov: ${Number(o.amount).toFixed(2)} GMD + Fee LOCKED ${Number(o.fee).toFixed(2)} GMD (2%) → Wave 872713918 Mariam Tunkara = Total <b>${Number(o.total).toFixed(2)} GMD</b><br>RRR: <b style="color:#166534">${o.rrr}</b><br><small>${o.date}</small></div><div style="margin-top:10px">${o.status!=='APPROVED'?`<button class="btn" style="background:#16a34a;color:#fff" onclick="approve(${idx})">✅ Approve & Release RRR</button>`: `<button class="btn" style="background:#e2e8f0" disabled>✅ Approved - RRR Released</button>`}<button class="btn" style="background:#fee2e2;color:#991b1b" onclick="del(${idx})">Delete</button><button class="btn" style="background:#fff;border:1px solid #cbd5e1" onclick="navigator.clipboard.writeText('${o.rrr}');alert('RRR Copied')">Copy RRR</button></div></div>`;
 }).join('');
}
function approve(i){orders[i].status='APPROVED'; localStorage.setItem('remitaOrders',JSON.stringify(orders)); render(); alert('Approved! Customer can now get RRR '+orders[i].rrr+' with Copy/Share/Save + QR Code');}
function del(i){if(confirm('Delete '+orders[i].id+'?')){orders.splice(i,1); localStorage.setItem('remitaOrders',JSON.stringify(orders)); render();}}
</script>
</body></html>
