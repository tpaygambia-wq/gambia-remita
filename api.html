<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gambia Remita API</title><style>body{font-family:Arial;background:#0f172a;color:white;padding:20px;text-align:center}.card{background:#1e293b;padding:25px;border-radius:12px;max-width:500px;margin:40px auto;border:1px solid #334155}.code{background:#0f172a;padding:15px;border-radius:8px;text-align:left;font-size:13px;word-break:break-all;margin:10px 0;border:1px dashed #334155}.success{color:#22c55e;font-weight:bold;font-size:20px}</style></head><body><div class="card" id="box"><h2>🔗 Gambia Remita API</h2><p id="status">Processing...</p><div id="result"></div></div><script>const MERCHANTS={GRA:"GRA-GM",MOFEA:"MOFEA-GM",AGD:"AGD-GM",GPA:"GPA-GM",GPC:"GPC-GM",UTG:"UTG-GM",GTTI:"GTTI-GM",MOBSE:"MOBSE-GM",EFSTH:"EFSTH-GM",GAMTEL:"GAMTEL-GM",AFRICELL:"AFRICELL-GM",QCELL:"QCELL-GM",NAWEC:"NAWEC-GM",TRUSTBANK:"TRUSTBANK-GM",ECOBANK:"ECOBANK-GM",MFH:"MFH-GM",SSHFC:"SSHFC-GM",GPF:"GPF-GM",CUSTOM:"CUSTOM-GM"};const API_KEY="OT2026CEO";const WAVE="872713918";function getParam(n){return new URLSearchParams(window.location.search).get(n)}let merchant=getParam("merchant")||"CUSTOM";let name=getParam("name")||getParam("customer")||getParam("student")||"Guest";let amount=parseFloat(getParam("amount")||"0");let service=getParam("service")||getParam("desc")||"Payment";let key=getParam("key")||getParam("api_key");let statusEl=document.getElementById("status");let resultEl=document.getElementById("result");if(key!==API_KEY){statusEl.innerHTML="❌ Invalid API Key";resultEl.innerHTML=`<div class="code">Access Denied! Use: .../api.html?merchant=UTG&name=Musa&amount=20000&key=OT2026CEO</div>`;}else if(!amount){statusEl.innerHTML="❌ Amount Missing";resultEl.innerHTML=`<div class="code">Example: https://gambia-remita.vercel.app/api.html?merchant=UTG&name=Musa Bah&amount=20000&service=School Fees&key=OT2026CEO</div>`;}else{let txs=JSON.parse(localStorage.getItem("ot_txs_full")||"[]");let prefix=MERCHANTS[merchant]||"CUSTOM-GM";let rrr=`${prefix}-${new Date().getFullYear()}-${1000+txs.length+1}-${Math.floor(Math.random()*9000+1000)}`;let tx={rrr,merchant,customer:name,service,amount,status:"PENDING",date:new Date().toLocaleString(),source:"API"};txs.unshift(tx);localStorage.setItem("ot_txs_full",JSON.stringify(txs));statusEl.innerHTML=`<span class="success">✅ RRR GENERATED</span>`;resultEl.innerHTML=`<div style="background:#0f172a;padding:20px;border-radius:10px;margin-top:15px"><h2 style="color:#22c55e">${rrr}</h2><p><b>Merchant:</b> ${merchant}</p><p><b>Customer:</b> ${name}</p><p><b>Amount:</b> D${amount.toLocaleString()}</p><p><b>Service:</b> ${service}</p><p style="color:#f59e0b"><b>Pay to:</b> Wave ${WAVE}</p></div><button onclick="window.location.href='admin.html'" style="padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:10px">Go to Admin</button>`;}</script></body></html>
