<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gambia Remita</title>
<style>body{margin:0;font-family:sans-serif;background:#f8fafc}header{background:#fff;padding:12px 16px;display:flex;gap:10px;border-bottom:1px solid #e2e8f0}.logo{width:36px;height:36px;background:#16a34a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}main{max-width:480px;margin:0 auto;padding:16px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #cbd5e1;margin:8px 0}button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;background:#16a34a;color:#fff} .card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin-top:12px}</style></head><body>
<header><div class="logo">R</div><div><b>Gambia Remita</b><br><small style="color:#64748b">Gov Payments - 2% Fee</small></div></header>
<main><h2>Generate RRR Number</h2><input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone"><select id="inst"><option>University of The Gambia (UTG)</option><option>Gambia Revenue Authority (GRA)</option><option>Immigration Department</option><option>Ministry of Education</option><option>Gambia Ports Authority</option></select><input id="amount" type="number" placeholder="Gov Amount e.g. 5000"><div style="background:#dcfce7;padding:10px;border-radius:10px;font-size:13px">Fee 2%: <b id="f">0 GMD</b> | Total: <b id="t">0 GMD</b></div><button onclick="gen()">Generate RRR & Order ID</button><div id="res" class="card" style="display:none"></div></main>
<script>
let orders=JSON.parse(localStorage.getItem('remitaOrders')||'[]');
document.getElementById('amount').addEventListener('input',e=>{let a=Number(e.target.value)||0;let fee=a*0.02;document.getElementById('f').innerText=fee.toFixed(2)+' GMD';document.getElementById('t').innerText=(a+fee).toFixed(2)+' GMD';});
function gen(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),inst=document.getElementById('inst').value,amount=Number(document.getElementById('amount').value);if(!name||!phone||!amount){alert('Fill all');return}let fee=amount*0.02;let id='ORD-'+Math.floor(1000000+Math.random()*9000000);let rrr=Math.floor(100000000000+Math.random()*900000000000);let o={name,phone,inst,amount,fee,id,rrr,status:'PENDING',date:new Date().toLocaleDateString()};orders.push(o);localStorage.setItem('remitaOrders',JSON.stringify(orders));let r=document.getElementById('res');r.style.display='block';r.innerHTML=`<b style="color:#16a34a">✓ Generated!</b><br><br>Order ID: <b>${id}</b><br>RRR: <b style="font-size:18px;color:#16a34a">${rrr}</b><br><br>Gov: GMD ${amount}<br>Fee: GMD ${fee.toFixed(2)}<br>Total: GMD ${(amount+fee).toFixed(2)}<br><br><button onclick="navigator.clipboard.writeText('${rrr}');alert('Copied')" style="background:#dcfce7;color:#16a34a">Copy RRR</button>`;}
</script></body></html>
