<!DOCTYPE html>
<html>
<head>
  <title>Gambia Remita - Pay GRA, NAWEC, UTG Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;padding:20px;background:#f4f4f9}
    .card{background:white;padding:20px;border-radius:12px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin-bottom:20px}
    input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
    button{background:#008751;color:white;font-weight:bold;border:none;cursor:pointer}
    .fee-box{background:#eef9f0;padding:10px;border-radius:8px;margin:10px 0}
    .status-box{background:#fff3cd;padding:15px;border-radius:8px;margin-top:10px}
  </style>
</head>
<body>

<!-- CARD 1: CREATE ORDER -->
<div class="card">
  <h2>🇬🇲 Gambia Remita</h2>
  <p>Pay GRA, NAWEC, UTG from home</p>
  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <select id="service">
    <option>GRA Tax</option><option>NAWEC Bill</option><option>UTG Fees</option><option>Police Clearance</option><option>Immigration</option>
  </select>
  <input id="amount" type="number" placeholder="Amount e.g 5000" oninput="calc()">
  <div class="fee-box">
    <div>Fee (2%): <b id="fee">D0</b></div>
    <div>Total Pay: <b id="total" style="color:green">D0</b> to Wave 872 713 918</div>
  </div>
  <button onclick="submitOrder()">Get Order ID</button>
  <div id="result"></div>
</div>

<!-- CARD 2: CHECK STATUS WITH ID/ORDER -->
<div class="card">
  <h3>🔍 Check Status With Order ID</h3>
  <input id="checkId" placeholder="Enter Order ID e.g ORD-123456-AB2">
  <button onclick="checkStatus()" style="background:#003366">Check Status</button>
  <div id="statusResult"></div>
</div>

<script>
function calc(){
  let amt = parseFloat(document.getElementById('amount').value) || 0;
  let fee = amt * 0.02;
  let total = amt + fee;
  document.getElementById('fee').innerText = 'D' + fee.toFixed(2);
  document.getElementById('total').innerText = 'D' + total.toFixed(2);
  return {amt, fee, total};
}

function submitOrder(){
  const {amt, fee, total} = calc();
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const service = document.getElementById('service').value;
  if(!name || !phone || amt==0){alert('Fill all');return;}
  const orderId = 'ORD-' + Date.now().toString().slice(-6) + '-' + Math.random().toString(36).substring(2,5).toUpperCase();
  const orderData = {orderId, name, phone, service, amount:amt, fee, total, status:'PENDING_PAYMENT', rrr:null, date:new Date().toISOString()};
  let orders = JSON.parse(localStorage.getItem('gambia_orders') || '[]');
  orders.push(orderData);
  localStorage.setItem('gambia_orders', JSON.stringify(orders));
  document.getElementById('result').innerHTML = `✅ Order Created!<br>Order ID: <span style="color:blue;font-size:18px">${orderId}</span><br>Total Pay: D${total.toFixed(2)} to Wave 872 713 918<br><small>Save this Order ID to check status!</small>`;
}

function checkStatus(){
  const id = document.getElementById('checkId').value.trim().toUpperCase();
  if(!id){alert('Enter Order ID');return;}
  let orders = JSON.parse(localStorage.getItem('gambia_orders') || '[]');
  let order = orders.find(o => o.orderId === id);
  let box = document.getElementById('statusResult');
  if(!order){
    box.innerHTML = `<div class="status-box" style="background:#f8d7da">❌ Order ID not found: ${id}</div>`;
    return;
  }
  if(order.status === 'PENDING_PAYMENT'){
    box.innerHTML = `<div class="status-box">⏳ Order: ${order.orderId}<br>Status: <b style="color:orange">PENDING - Waiting Wave Payment</b><br>Amount: D${order.amount}<br>Total Paid: D${order.total}<br><small>Please pay to Wave 872 713 918 and wait for confirmation. Your RRR will show here after.</small></div>`;
  } else if(order.status === 'PAID'){
    box.innerHTML = `<div class="status-box" style="background:#d4edda">✅ Order: ${order.orderId}<br>Status: <b style="color:green">PAID & CONFIRMED</b><br>Your RRR: <span style="font-size:20px;color:blue">${order.rrr}</span><br>Service: ${order.service}<br><button onclick="window.print()">Download Receipt</button></div>`;
  }
}
</script>
</body>
</html>
