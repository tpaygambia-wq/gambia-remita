<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gambia Remita - V9 Cloud</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui;padding:14px;margin:0}
.card{background:#1e293b;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid #334155}
h2{margin:0 0 8px;color:#22c55e}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;margin-top:6px;box-sizing:border-box}
label{font-size:12px;color:#94a3b8;margin-top:10px;display:block;font-weight:700}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:900;cursor:pointer;margin-top:10px}
.btn-green{background:#22c55e;color:#000}
.btn-dark{background:#1e293b;color:white;border:1px solid #334155}
.fee-box{background:#0f172a;border:1px dashed #22c55e;border-radius:12px;padding:12px;margin-top:10px;display:none}
.track-box{background:#0f172a;border-left:4px solid #f59e0b;border-radius:12px;padding:12px;margin-top:10px}
.rrr-box{background:#dcfce7;border-left:4px solid #22c55e;border-radius:12px;padding:12px;margin-top:10px;color:#052e16}
.wave-bar{background:#22c55e;color:#000;border-radius:12px;padding:10px;text-align:center;font-weight:900;margin-top:8px}
</style></head><body>
<div class="card">
<h2>👑 Gambia Remita V9 Cloud</h2>
<small style="color:#94a3b8">CEO Ousman Tunkara • Wave 872713918 • Cloud Secure</small>
<div class="wave-bar"><i class="fa fa-wave-square"></i> Wave: 872713918 <button onclick="copyWave()" style="margin-left:10px;padding:4px 8px;border-radius:8px;border:0;font-weight:900">Copy</button></div>
<label>1. Merchant / Service</label><select id="merchant"><option value="">Select</option><option>GRA Tax</option><option>NAWEC</option><option>Gamtel</option><option>University</option><option>Other Bill</option></select>
<label>2. Service Description</label><input id="service" placeholder="e.g GRA Tax for Shop">
<label>3. Customer Full Name</label><input id="cName" placeholder="e.g Lamin Ceesay">
<label>4. Customer Phone</label><input id="cPhone" placeholder="e.g 3xxxxxx">
<label>5. Government Amount D</label><input id="amount" type="number" placeholder="e.g 5000" oninput="calcFee()">
<div class="fee-box" id="feePreview"><div style="display:flex;justify-content:space-between"><span>Gov Amount</span><b id="feeGov"></b></div><div style="display:flex;justify-content:space-between"><span>Fee 2%</span><b id="feeFee"></b></div><div style="display:flex;justify-content:space-between;border-top:1px solid #334155;margin-top:6px;padding-top:6px"><span>Total to Wave</span><b id="feeTotal" style="color:#22c55e"></b></div><small>Pay total to Wave 872713918</small></div>
<label>6. Wave Receipt Photo</label><input type="file" id="receiptFile" accept="image/*" onchange="previewReceipt(this)"><div id="receiptPreview" style="display:none;margin-top:8px"><img id="previewImg" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover"><small style="color:#22c55e">✅ Photo attached</small></div>
<label>7. Wave Transaction ID (or paste if no photo)</label><input id="payRef" placeholder="e.g TxID or leave if photo uploaded">
<button class="btn btn-green" onclick="submitRequest()"><i class="fa fa-cloud-arrow-up"></i> Submit to Cloud Secure</button>
<label style="margin-top:18px">Track Your RRR — Enter ORD / Phone / RRR</label><div style="display:flex;gap:8px"><input id="trackInput" placeholder="ORD-xxxx or Phone"><button class="btn btn-dark" style="width:90px;margin-top:6px" onclick="trackOrder()">Track</button></div>
<div id="trackResult" style="margin-top:10px"></div>
<div style="text-align:center;margin-top:12px"><small>Wave Total Pay: <b id="waveTotalText">D0</b> → 872713918</small></div>
</div>
<script>
const SUPABASE_URL="https://afzwszicghxwjyqkhbua.supabase.co";
const SUPABASE_KEY="sb_publishable_lEgI1aNiLJzE6cf_iC_roQ_jgfD8XTS";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let receiptBase64="";function genORD(){return "ORD-"+Math.floor(1000000+Math.random()*9000000);}
const $=id=>document.getElementById(id);
function copyWave(){navigator.clipboard.writeText("872713918");alert("✅ Wave Copied: 872713918");}
function calcFee(){let a=parseFloat($("amount").value);let box=$("feePreview");if(!a){box.style.display="none";$("waveTotalText").innerText="D0";return;}box.style.display="block";let fee=Math.round(a*0.02);let total=a+fee;$("feeGov").innerText="D"+a.toLocaleString();$("feeFee").innerText="D"+fee.toLocaleString();$("feeTotal").innerText="D"+total.toLocaleString();$("waveTotalText").innerText="D"+total.toLocaleString();}
function previewReceipt(input){if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{receiptBase64=e.target.result;$("previewImg").src=receiptBase64;$("receiptPreview").style.display="block";};r.readAsDataURL(input.files[0]);}}
async function submitRequest(){let m=$("merchant").value,s=$("service").value.trim(),n=$("cName").value.trim(),p=$("cPhone").value.trim(),a=parseFloat($("amount").value),r=$("payRef").value.trim();if(!m||!s||!n||!p||!a){alert("Fill 1 to 5!");return;}if(!r&&!receiptBase64){alert("Upload Wave receipt photo OR paste TxID!");return;}let ord=genORD();let fee=Math.round(a*0.02);let total=a+fee;$("trackResult").innerHTML="<div style='padding:20px;text-align:center'>⏳ Saving to cloud...</div>";let {error}=await supabaseClient.from("transactions").insert([{ord,rrr:"AWAITING-APPROVAL",merchant:m,service:s,customer:n,phone:p,amount:a,fee:fee,total:total,payRef:r||"PHOTO-UPLOADED",receiptImg:receiptBase64,status:"PENDING",date:new Date().toLocaleString()}]);if(error){alert("Error: "+error.message);return;}$("trackResult").innerHTML=`<div class="track-box"><div style="font-weight:900">✅ SAVED TO CLOUD! COPY ID!</div><div style="font-size:26px;font-weight:900;margin-top:10px;font-family:monospace">${ord}</div><div style="margin-top:8px"><b>${n}</b> - ${m}<br>Total D${total.toLocaleString()} to Wave 872713918<br>Status: PENDING</div><button class="btn btn-dark" style="margin-top:10px" onclick="navigator.clipboard.writeText('${ord}');alert('Copied!')"><i class="fa fa-copy"></i> Copy Tracking ID</button></div>`;["merchant","service","cName","cPhone","amount","payRef"].forEach(id=>{let e=$(id);if(e)e.value="";});$("receiptFile").value="";$("receiptPreview").style.display="none";receiptBase64="";$("feePreview").style.display="none";}
async function trackOrder(){let q=($("trackInput").value||"").trim();if(!q){alert("Enter ORD");return;}$("trackResult").innerHTML="⏳ Checking cloud...";let {data,error}=await supabaseClient.from("transactions").select("*").or(`ord.ilike.%${q}%,phone.ilike.%${q}%,rrr.ilike.%${q}%`).limit(5);if(error||!data||data.length===0){$("trackResult").innerHTML="<div style='background:#fee2e2;padding:12px;border-radius:12px;color:#111827'>❌ Not found for "+q+"</div>";return;}let html="";data.forEach(t=>{if(t.status==="PENDING"){html+=`<div class="track-box"><b>${t.ord}</b> - <span style="background:#f59e0b;padding:2px 8px;border-radius:10px;font-size:11px">PENDING</span><br>${t.customer} - ${t.merchant} D${t.total}<br><small>${t.date}</small></div>`;}else{html+=`<div class="rrr-box"><b>✅ DONE</b><br><b style="font-size:20px;font-family:monospace">${t.rrr}</b><br>Tracking: ${t.ord}<br>${t.customer} - D${t.total}<br><div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn btn-dark" onclick="navigator.clipboard.writeText('${t.rrr}')">Copy RRR</button></div></div>`;}});$("trackResult").innerHTML=html;}
</script></body></html>
