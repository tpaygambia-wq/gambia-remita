
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gambia Remita 2% Auto Fee</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:12px}
.box{max-width:420px;margin:auto;background:white;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,select{width:100%;padding:13px;margin:6px 0 12px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{width:100%;padding:15px;background:#006633;color:white;font-weight:bold;border:none;border-radius:12px;font-size:17px}
.feeBox{background:#fef9c3;border:2px solid #eab308;padding:12px;border-radius:12px;text-align:center;margin:10px 0;font-weight:bold}
.pay{border:2px solid #ddd;padding:12px;border-radius:10px;margin:7px 0;cursor:pointer;background:white}
.pay.active{border-color:#006633;background:#dcfce7;font-weight:bold}
.receipt{display:none;background:#f0fdf4;border:2px solid #16a34a;padding:15px;border-radius:12px;margin-top:15px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;margin:0">🇬🇲 Gambia Remita</h2>
<p style="text-align:center;font-size:13px;color:#555">Auto Fee 2% Added Instantly</p>

<label>Institution</label>
<select id="inst"><option>UTG University</option><option>GRA Tax</option><option>MOBSE School Fees</option><option>GPF Police Fine</option><option>GTTI</option><option>Gambia College</option></select>

<label>Full Name</label>
<input id="name" placeholder="Lamin Jallow">

<label>Phone</label>
<input id="phone" type="number" placeholder="6599013">

<label>Government Amount (GMD)</label>
<input id="amt" type="number" placeholder="5000">

<div id="feeBox" class="feeBox">💰 Type amount - Fee adds automatically</div>

<label>Choose Payment:</label>
<div onclick="setPay('Bank Transfer',this)" class="pay active">🏦 Bank Transfer</div>
<div onclick="setPay('Card',this)" class="pay">💳 Card - Visa/Mastercard</div>
<div onclick="setPay('Wave',this)" class="pay">🌊 Wave Mobile Money</div>
<div onclick="setPay('QMoney',this)" class="pay">📱 QMoney</div>
<div onclick="setPay('Afrimoney',this)" class="pay">📱 Afrimoney</div>

<div style="background:#cffafe;padding:10px;border-radius:10px;margin:12px 0;text-align:center">
⚠️ <b>YOUR 2% FEE TO:</b><br><span style="font-size:22px;font-weight:bold;color:#065f46">Wave: 659 9013</span><br>Marian Tunkara
</div>

<button onclick="gen()">Generate RRR</button>

<div id="receipt" class="receipt">
<h3>✅ RRR Generated!</h3>
<h2 id="rrr"></h2>
<p id="details"></p>
<button onclick="location.reload()" style="background:#334155;margin-top:10px">New Payment</button>
</div>
</div>

<script>
let selectedPay='Bank Transfer';let fee=0,total=0,gov=0;
function setPay(m,el){selectedPay=m;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function autoCalc(){
 gov=parseFloat(document.getElementById('amt').value);
 let box=document.getElementById('feeBox');
 if(!gov||gov<=0){box.innerHTML='💰 Type amount - Fee adds automatically';fee=0;total=0;return;}
 fee=gov*0.02;total=gov+fee;
 box.innerHTML='Gov: '+gov+' GMD<br>Fee 2%: '+fee.toFixed(2)+' GMD<br><span style="font-size:18px">TOTAL: '+total.toFixed(2)+' GMD</span><br><small>Fee added automatically ✅</small>';
}
document.getElementById('amt').addEventListener('input', autoCalc);
document.getElementById('amt').addEventListener('keyup', autoCalc);
document.getElementById('amt').addEventListener('change', autoCalc);
function gen(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 gov=parseFloat(document.getElementById('amt').value);
 let inst=document.getElementById('inst').value;
 if(!name||!phone||!gov){alert('Fill Name, Phone, Amount');return;}
 autoCalc();
 let rrr='GM-'+Math.floor(10000000+Math.random()*90000000);
 let all=JSON.parse(localStorage.getItem('gambia_payments')||'[]');
 all.push({rrr,name,phone,amt:gov,fee,total,institution:inst,method:selectedPay,date:new Date().toLocaleString(),status:'pending'});
 localStorage.setItem('gambia_payments',JSON.stringify(all));
 document.getElementById('rrr').innerText=rrr;
 document.getElementById('details').innerHTML=name+'<br>'+inst+'<br>Gov '+gov+' + Fee '+fee.toFixed(2)+' = <b>'+total.toFixed(2)+' GMD</b><br>'+selectedPay;
 document.getElementById('receipt').style.display='block';
 window.scrollTo(0,9999);
}
</script>
</body>
</html>
