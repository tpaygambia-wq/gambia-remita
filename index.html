<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gambia Remita</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f8fafc;color:#0f172a}header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0;position:sticky;top:0}.logoB{width:36px;height:36px;background:#16a34a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}main{padding:16px;max-width:500px;margin:0 auto}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #cbd5e1;margin:8px 0;font-size:15px}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;background:#16a34a;color:#fff;font-size:16px;margin-top:8px}.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin:12px 0}.boss{margin-top:40px;border-top:2px dashed #16a34a;padding-top:16px}.hidden{display:none}</style></head><body>
<header><div style="display:flex;gap:10px;align-items:center"><div class="logoB">B</div><b>Gambia Remita<br><small style="font-weight:400;color:#64748b">Pay Government - 2% Fee</small></b></div><a href="#boss" style="color:#16a34a;font-weight:800;text-decoration:none">Boss</a></header>
<main>
<div id="customer">
<h2>Generate RRR</h2>
<input id="name" placeholder="Full Name - e.g. Lamin Jallow">
<input id="phone" placeholder="Phone - 355XXXX">
<select id="inst"><option>University of The Gambia (UTG)</option><option>Gambia Revenue Authority</option><option>Immigration Department</option><option>Ministry of Education</option></select>
<input id="amount" type="number" placeholder="Gov Amount - e.g. 5000">
<div style="background:#dcfce7;padding:10px;border-radius:10px;font-size:13px">Your Fee 2%: <b id="feeView">0 GMD</b> | Gov will receive: <b id="govView">0 GMD</b></div>
<button class="btn" onclick="gen()">Generate RRR & Order ID</button>
<div id="result" class="card hidden"></div>
</div>

<div id="boss" class="boss">
<h3>Boss Login - Dashboard</h3>
<input id="bpass" type="password" placeholder="admin123"><button class="btn" onclick="bossLogin()">Unlock Dashboard</button>
<div id="bdash" class="hidden">
<p>Total: <b id="cTotal">0</b> | Profit: <b id="cProfit">0</b> | Gov: <b id="cGov">0</b> | Settled: <b id="cSet">0</b></p>
<input id="search" placeholder="Search name, RRR" oninput="render()" style="border-color:#16a34a;border-width:2px">
<div style="display:flex;gap:8px"><button class="btn" onclick="exportCSV()" style="background:#0f172a">Excel for Bank</button><button class="btn" onclick="if(confirm('Mark all as settled?')){let gov=orders.reduce((s,o)=>s+(Number(o.amount)||0),0);let set=Number(localStorage.getItem('remSet')||0)+gov;localStorage.setItem('remSet',set);localStorage.setItem('remitaOrders',JSON.stringify([]));location.reload();}" style="background:#f1f5f9;color:#000">Mark All Paid</button></div>
<div id="blist"></div>
</div>
</div>
</main>
<script>
let orders=JSON.parse(localStorage.getItem('remitaOrders')||'[]');
document.getElementById('amount').addEventListener('input',e=>{let a=Number(e.target.value)||0;let f=a*0.02;document.getElementById('feeView').innerText=f.toFixed(2)+' GMD';document.getElementById('govView').innerText=a.toFixed(2)+' GMD';});
function gen(){let name=document.getElementById('name').value,phone=document.getElementById('phone').value,inst=document.getElementById('inst').value,amount=Number(document.getElementById('amount').value);if(!name||!phone||!amount){alert('Fill all');return}let fee=amount*0.02;let id='ORD-'+Math.floor(1000000+Math.random()*9000000);let rrr=Math.floor(100000000000+Math.random()*900000000000);let o={name,phone,inst,amount,fee,id,rrr,status:'PENDING'};orders.push(o);localStorage.setItem('remitaOrders',JSON.stringify(orders));document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML=`<b>Success!</b><br>Order: ${id}<br>RRR: <b style="color:green">${rrr}</b><br>Amount: GMD ${amount} + Fee GMD ${fee.toFixed(2)}<br><small>Show this RRR at bank</small>`; }
function bossLogin(){if(document.getElementById('bpass').value!=='admin123'){alert('Wrong');return}document.getElementById('bdash').classList.remove('hidden');render();}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let filt=orders.filter(o=>(o.name+o.phone+o.id+String(o.rrr)).toLowerCase().includes(q)).reverse();let profit=orders.reduce((s,o)=>s+(Number(o.fee)||0),0);let gov=orders.reduce((s,o)=>s+(Number(o.amount)||0),0);let sett=Number(localStorage.getItem('remSet')||0);document.getElementById('cTotal').innerText=filt.length;document.getElementById('cProfit').innerText=profit.toFixed(2)+' GMD';document.getElementById('cGov').innerText=gov.toFixed(2)+' GMD';document.getElementById('cSet').innerText=sett.toFixed(2)+' GMD';let h='';filt.forEach(o=>{h+=`<div class="card"><b>${o.name}</b> ${o.phone}<br>${o.inst}<br>GMD ${o.amount} + Fee ${o.fee.toFixed(2)}<br>ORD: ${o.id}<br>RRR: <span style="color:green;font-weight:800">${o.rrr}</span> - ${o.status} <button onclick="let oo=JSON.parse(localStorage.getItem('remitaOrders')||'[]');oo.find(x=>x.id==='${o.id}').status='APPROVED';localStorage.setItem('remitaOrders',JSON.stringify(oo));render();" style="padding:6px 10px;background:#16a34a;color:#fff;border:none;border-radius:8px">Approve</button></div>`});document.getElementById('blist').innerHTML=h||'No orders';}
function exportCSV(){let csv='Name,Phone,Institution,GovAmount,Fee,Order,RRR,Status\n';orders.forEach(o=>{csv+=`"${o.name}",${o.phone},"${o.inst}",${o.amount},${o.fee},${o.id},${o.rrr},${o.status}\n`});let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='Remita-Bank-'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
if(location.hash==='#boss'){document.getElementById('boss').scrollIntoView();}
</script></body></html>
